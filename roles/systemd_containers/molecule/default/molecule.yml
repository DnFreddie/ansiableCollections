---
dependency:
  name: galaxy

driver:
  name: vagrant
  provider: virtualbox
  options:
    memory: 192
    cpus: 1

platforms:
  - name: instance
    box: generic/rocky9
    interfaces:
      - auto_config: true
        network_name: private_network
        type: static
        ip: 192.168.57.42
provisioner:
  name: ansible
  log: true
  lint:
    name: ansible-lint
  scenario:
    name: default
  verifier:
    name: ansible
  inventory:
    group_vars:
      all:
        containers:
          - name: linkding
            env_file: "env.j2"
            image: docker.io/sissbruecker/linkding:latest
            ports:
              - { host: "9093", container: "9090" }
            volumes:
              - { host: "data", container: "/app/data" }
          - name: adminer
            image: docker.io/library/adminer:latest
            ports:
              - { host: "8080", container: "8080" }

